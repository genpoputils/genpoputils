<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brand Gradient: vibrant electric blue to indigo to violet -->
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="gpuShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle container matching 16px corner radius -->
  <rect width="64" height="64" rx="16" fill="url(#gpuGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- The Modular Utility Matrix + Focal Period '.' of GenPopUtils. -->
  <g filter="url(#gpuShadow)">
    <!-- Top-Left tile: Arithmetic / Calculation -->
    <rect x="15" y="15" width="14" height="14" rx="4.5" fill="#ffffff" />
    
    <!-- Top-Right tile: Logic / Developer tools -->
    <rect x="35" y="15" width="14" height="14" rx="4.5" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Bottom-Left tile: Conversion & Scenarios -->
    <rect x="15" y="35" width="14" height="14" rx="4.5" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Bottom-Right: The Signature Focal Period '.' of GenPopUtils. -->
    <circle cx="42" cy="42" r="7.5" fill="#ffffff" />
  </g>
</svg>
